<title>PAWTRAIL｜愛犬とおでかけ地図</title>
<meta name="description" content="関東・甲信・東北・東海の犬と遊べる施設、犬と入れる施設、ドッグラン、犬と入れる飲食店、動物病院をまとめた愛犬おでかけガイド">
<meta name="theme-color" content="#16302A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --pine:#16302A;
    --pine-deep:#0E211C;
    --sage:#4C7A6B;
    --sage-soft:#DCE7DE;
    --gold:#E3B23C;
    --gold-deep:#C4901F;
    --paper:#FAF8F2;
    --paper-card:#FFFFFF;
    --ink:#1E2620;
    --ink-soft:#5B675F;
    --line:#E2E0D4;
    --outdoor:#5E8F4A;
    --outdoor-bg:#EAF3E4;
    --indoor:#3B6FA0;
    --indoor-bg:#E7EFF6;
    --danger:#B4472F;
    --radius:16px;
    --shadow: 0 2px 10px rgba(14,33,28,0.08), 0 8px 24px rgba(14,33,28,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Noto Sans JP",sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    position:relative;
  }

  /* ---------- Header ---------- */
  header.top{
    background:linear-gradient(160deg,var(--pine) 0%, var(--pine-deep) 100%);
    color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 16px;
    position:sticky;
    top:0;
    z-index:30;
    box-shadow:0 4px 16px rgba(0,0,0,0.15);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .paw{
    width:34px;height:34px;flex-shrink:0;
  }
  .brand h1{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:0.5px;
    margin:0;
    line-height:1;
  }
  .brand .sub{
    font-size:11px;
    color:var(--gold);
    font-weight:500;
    letter-spacing:1.5px;
    margin-top:2px;
  }
  .region-row{
    display:flex;
    gap:8px;
    margin-top:16px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .region-row::-webkit-scrollbar{display:none;}
  .region-chip{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    color:rgba(255,255,255,0.75);
    font-size:14px;
    font-weight:700;
    font-family:"Zen Maru Gothic",sans-serif;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .region-chip.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--pine-deep);
  }

  /* ---------- Category tabs ---------- */
  .cat-tabs{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    padding:14px 14px 0;
    position:sticky;
    top:calc(env(safe-area-inset-top,0px) + 128px);
    background:var(--paper);
    z-index:25;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .cat-tab{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 2px 10px;
    border-radius:12px;
    cursor:pointer;
    color:var(--ink-soft);
    border:1px solid transparent;
  }
  .cat-tab .ico{font-size:19px;line-height:1;}
  .cat-tab .lbl{font-size:10.5px;font-weight:700;text-align:center;line-height:1.25;}
  .cat-tab.active{
    background:var(--sage-soft);
    color:var(--pine);
    border-color:var(--sage);
  }

  /* ---------- View toggle ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px 4px;
  }
  .count-label{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .view-toggle{
    display:flex;
    background:var(--sage-soft);
    border-radius:10px;
    padding:3px;
    gap:2px;
  }
  .view-toggle button{
    border:none;
    background:transparent;
    padding:6px 12px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    font-family:"Zen Maru Gothic",sans-serif;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .view-toggle button.active{
    background:var(--pine);
    color:#fff;
  }

  /* ---------- Content ---------- */
  main{
    flex:1;
    padding:8px 16px 100px;
  }
  .region-note{
    font-size:12px;
    color:var(--ink-soft);
    background:var(--sage-soft);
    border-radius:10px;
    padding:10px 12px;
    margin:8px 0 14px;
    line-height:1.6;
  }
  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px 14px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .card.outdoor{border-left:5px solid var(--outdoor);}
  .card.indoor{border-left:5px solid var(--indoor);}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card h3{
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:16px;
    margin:0 0 4px;
    line-height:1.4;
    color:var(--pine-deep);
  }
  .badge{
    flex-shrink:0;
    font-size:11px;
    font-weight:700;
    padding:4px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge.outdoor{background:var(--outdoor-bg);color:var(--outdoor);}
  .badge.indoor{background:var(--indoor-bg);color:var(--indoor);}
  .addr{
    font-family:"JetBrains Mono",monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin:2px 0 8px;
  }
  .note{
    font-size:13px;
    line-height:1.7;
    color:var(--ink);
    margin:0 0 12px;
  }
  .tel{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--sage);
    margin:-6px 0 10px;
  }
  .card-actions{
    display:flex;
    gap:8px;
  }
  .card-actions a{
    flex:1;
    text-align:center;
    text-decoration:none;
    font-size:12.5px;
    font-weight:700;
    font-family:"Zen Maru Gothic",sans-serif;
    padding:9px 6px;
    border-radius:10px;
    border:1px solid var(--line);
    color:var(--pine);
    background:var(--paper);
  }
  .card-actions a.route{
    background:var(--pine);
    border-color:var(--pine);
    color:#fff;
  }

  .vet-search-card{
    background:var(--pine);
    color:#fff;
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .vet-search-card h4{
    font-family:"Zen Maru Gothic",sans-serif;
    margin:0 0 6px;
    font-size:15px;
  }
  .vet-search-card p{
    font-size:12.5px;
    line-height:1.7;
    margin:0 0 12px;
    color:rgba(255,255,255,0.85);
  }
  .vet-search-card a{
    display:inline-block;
    background:var(--gold);
    color:var(--pine-deep);
    text-decoration:none;
    font-weight:700;
    font-size:13px;
    padding:9px 16px;
    border-radius:10px;
    font-family:"Zen Maru Gothic",sans-serif;
  }

  /* ---------- Map ---------- */
  #map{
    height:calc(100vh - 320px);
    min-height:360px;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--line);
    margin-top:6px;
  }
  .leaflet-popup-content{font-family:"Noto Sans JP",sans-serif; font-size:12.5px;}
  .leaflet-popup-content b{font-family:"Zen Maru Gothic",sans-serif; font-size:13.5px;}
  .legend{
    display:flex;
    gap:14px;
    margin:10px 0 4px;
    font-size:11.5px;
    color:var(--ink-soft);
    align-items:center;
  }
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .dot.outdoor{background:var(--outdoor);}
  .dot.indoor{background:var(--indoor);}
  .dot.other{background:var(--gold-deep);}

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding:18px 20px 30px;
  }

  @media (max-width:360px){
    .cat-tab .lbl{font-size:9.5px;}
  }
</style>
</head>

      {name:"りんくうビーチ", addr:"愛知県常滑市", note:"東海地区最大級の人工海浜(約630m)。SEA AND SKY TERRACEにドッグラン併設。", lat:34.858,lng:136.805},
      {name:"位山道の駅(位山スノーパーク跡地)", addr:"岐阜県高山市周辺", note:"4〜11月のグリーンシーズンのみ無料ドッグランとして開放。小型中型/大型の2エリア制。", lat:36.086,lng:137.256},

    ],

      {name:"DOGPARKカフェオーレ", addr:"静岡県(東海エリア)", note:"室内ドッグランに併設されたウッドデッキで軽食・ドリンク提供。", lat:34.702,lng:137.734},

const CATS = [
  {key:"play", label:"遊べる施設", icon:"🐕"},
  {key:"allowed", label:"入れる施設", icon:"🏛️"},
  {key:"dogrun", label:"ドッグラン", icon:"🟢"},
  {key:"restaurant", label:"飲食店", icon:"🍽️"},
  {key:"vet", label:"動物病院", icon:"🏥"},
];

let state = { region:"kanto", cat:"play", view:"list" };
let map, markersLayer;

/* ---------- render tabs ---------- */
function renderRegionRow(){
  const row = document.getElementById("regionRow");
  row.innerHTML = "";
  Object.keys(DATA).forEach(key=>{
    const chip = document.createElement("div");
    chip.className = "region-chip" + (state.region===key ? " active":"");
    chip.textContent = DATA[key].icon + " " + DATA[key].label;
    chip.onclick = ()=>{ state.region=key; render(); };
    row.appendChild(chip);
  });
}

function renderCatTabs(){
  const row = document.getElementById("catTabs");
  row.innerHTML = "";
  CATS.forEach(c=>{
    const el = document.createElement("div");
    el.className = "cat-tab" + (state.cat===c.key ? " active":"");
    el.innerHTML = `<div class="ico">${c.icon}</div><div class="lbl">${c.label}</div>`;
    el.onclick = ()=>{ state.cat=c.key; render(); };
    row.appendChild(el);
  });
}

function mapsRouteUrl(item){
  const q = encodeURIComponent(item.name + " " + item.addr);
  return `https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=driving`;
}
function mapsViewUrl(item){
  const q = encodeURIComponent(item.name + " " + item.addr);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function renderList(){
  const region = DATA[state.region];
  const items = region[state.cat] || [];
  const listEl = document.getElementById("listView");
  document.getElementById("regionNote").textContent = region.note;
  document.getElementById("countLabel").textContent = items.length + "件";
  listEl.innerHTML = "";

  if(state.cat === "vet"){
    const card = document.createElement("div");
    card.className = "vet-search-card";
    card.innerHTML = `<h4>🏥 現在地周辺の動物病院を探す</h4>
      <p>${region.label}エリアの夜間救急・動物病院は流動的なため、下記から現在地・訪問先周辺の最新情報をGoogleマップで検索できます。受診前は必ず事前にお電話でご確認ください。</p>
      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('動物病院 ' + region.label)}" target="_blank" rel="noopener">周辺の動物病院を検索 →</a>`;
    listEl.appendChild(card);
  }

  if(items.length === 0 && state.cat !== "vet"){
    listEl.innerHTML += `<div class="region-note">現在このエリア・カテゴリの厳選施設情報を収集中です。地図タブから周辺検索、または上部の他エリアもご覧ください。</div>`;
    return;
  }

  items.forEach(item=>{
    const card = document.createElement("div");
    card.className = "card" + (item.type ? " "+item.type : "");
    let badge = "";
    if(item.type === "outdoor") badge = `<span class="badge outdoor">屋外</span>`;
    if(item.type === "indoor") badge = `<span class="badge indoor">屋内</span>`;
    card.innerHTML = `
      <div class="card-top">
        <h3>${item.name}</h3>
        ${badge}
      </div>
      <div class="addr">📍 ${item.addr}</div>
      ${item.tel ? `<div class="tel">☎ ${item.tel}</div>` : ""}
      <p class="note">${item.note || ""}</p>
      <div class="card-actions">
        <a href="${mapsViewUrl(item)}" target="_blank" rel="noopener">地図で見る</a>
        <a class="route" href="${mapsRouteUrl(item)}" target="_blank" rel="noopener">ルート検索</a>
      </div>
    `;
    listEl.appendChild(card);
  });
}

function ensureMap(){
  if(map) return;
  map = L.map("map", {zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function renderMap(){
  ensureMap();
  const region = DATA[state.region];
  const items = region[state.cat] || [];
  markersLayer.clearLayers();
  map.setView(region.center, region.zoom);

  items.forEach(item=>{
    let color = "#C4901F";
    if(item.type==="outdoor") color="#5E8F4A";
    if(item.type==="indoor") color="#3B6FA0";
    const marker = L.circleMarker([item.lat, item.lng], {
      radius:9, color:"#fff", weight:2, fillColor:color, fillOpacity:0.95
    }).addTo(markersLayer);
    marker.bindPopup(`<b>${item.name}</b><br>${item.addr}<br><br>
      <a href="${mapsRouteUrl(item)}" target="_blank" rel="noopener">ルート検索 →</a>`);
  });

  setTimeout(()=>{ map.invalidateSize(); }, 150);
}

function render(){
  renderRegionRow();
  renderCatTabs();
  if(state.view === "list"){
    document.getElementById("listView").style.display = "block";
    document.getElementById("mapView").style.display = "none";
    renderList();
  } else {
    document.getElementById("listView").style.display = "none";
    document.getElementById("mapView").style.display = "block";
    document.getElementById("regionNote").textContent = DATA[state.region].note;
    document.getElementById("countLabel").textContent = (DATA[state.region][state.cat]||[]).length + "件";
    renderMap();
  }
}

document.getElementById("btnList").onclick = ()=>{
  state.view="list";
  document.getElementById("btnList").classList.add("active");
  document.getElementById("btnMap").classList.remove("active");
  render();
};
document.getElementById("btnMap").onclick = ()=>{
  state.view="map";
  document.getElementById("btnMap").classList.add("active");
  document.getElementById("btnList").classList.remove("active");
  render();
};

render();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
